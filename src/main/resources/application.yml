########## local, dev, prd 공통 설정 ##########

project:
  name: spring-boot-batch
  version: 1.0
  base-pkg: com.example #// FIXME CHECK-package 확인 (공통 설정)
  base-pkg-2: com.sample #// FIXME CHECK-package 확인 (공통 설정)
  locale: ko_KR
  time-zone: Asia/Seoul
#  locale: en_US
#  time-zone: UTC


# spring
spring:
  batch:
    job:
      enabled: false  # 앱 시작 시 배치 자동 실행 방지 (스케줄러가 알아서 실행하도록)
  application:
    name: ${project.name}
  profiles:
    active:
      - local


# logging
logging:
  level:
    root: INFO
    com.example: DEBUG


